<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ratleikurinn</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green-dark: #1a3d1a;
    --green-mid: #2d6a2d;
    --green-light: #4a9e4a;
    --green-pale: #e8f5e8;
    --gold: #d4a017;
    --gold-pale: #fdf3d0;
    --text: #1a1a1a;
    --text-muted: #666;
    --white: #ffffff;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--green-dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    max-width: 420px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(0,0,0,0.4);
  }

  .card-header {
    background: var(--green-mid);
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-title {
    font-family: 'Fraunces', serif;
    font-size: 1.2rem;
    color: var(--white);
    letter-spacing: 0.01em;
  }

  .stod-badge {
    background: rgba(255,255,255,0.15);
    color: var(--white);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }

  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.2);
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.4s ease;
  }

  .card-body { padding: 1.75rem 1.5rem; }

  .location-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--green-pale);
    color: var(--green-mid);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 1.25rem;
    letter-spacing: 0.03em;
  }

  .location-tag::before {
    content: '📍';
    font-size: 0.85rem;
  }

  .question-text {
    font-family: 'Fraunces', serif;
    font-size: 1.35rem;
    color: var(--text);
    line-height: 1.45;
    margin-bottom: 1.5rem;
  }

  .answer-section { margin-bottom: 1.25rem; }

  .answer-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .answer-input {
    width: 100%;
    padding: 0.85rem 1rem;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1rem;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    transition: border-color 0.2s;
    outline: none;
  }
  .answer-input:focus { border-color: var(--green-light); }
  .answer-input.correct { border-color: #4a9e4a; background: #f0faf0; }
  .answer-input.wrong { border-color: #e05050; background: #fff5f5; }

  .check-btn {
    width: 100%;
    background: var(--green-mid);
    color: var(--white);
    border: none;
    border-radius: 10px;
    padding: 0.9rem;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-bottom: 1rem;
  }
  .check-btn:hover { background: var(--green-light); }
  .check-btn:active { transform: scale(0.98); }
  .check-btn:disabled { background: #ccc; cursor: default; }

  .result-box {
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: 1rem;
    display: none;
  }
  .result-box.correct-box { background: #f0faf0; border: 1.5px solid #4a9e4a; }
  .result-box.wrong-box { background: #fff5f5; border: 1.5px solid #e05050; }
  .result-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 3px; }
  .correct-box .result-title { color: #2d6a2d; }
  .wrong-box .result-title { color: #b03030; }
  .result-answer { font-size: 0.88rem; color: var(--text-muted); }

  .next-hint {
    background: var(--gold-pale);
    border: 1.5px solid #e8c840;
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    display: none;
  }
  .next-hint-label {
    font-size: 0.72rem;
    font-weight: 700;
    color: #8a6500;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .next-hint-text {
    font-size: 0.95rem;
    font-weight: 600;
    color: #5a4000;
  }

  .error-screen {
    text-align: center;
    padding: 3rem 2rem;
  }
  .error-screen h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    color: var(--text);
    margin-bottom: 0.75rem;
  }
  .error-screen p { color: var(--text-muted); line-height: 1.6; }

  .finish-screen {
    text-align: center;
    padding: 2.5rem 1.5rem;
  }
  .finish-emoji { font-size: 3rem; margin-bottom: 1rem; }
  .finish-screen h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    color: var(--green-dark);
    margin-bottom: 0.75rem;
  }
  .finish-screen p { color: var(--text-muted); line-height: 1.6; font-size: 1rem; }
</style>
</head>
<body>

<div class="card" id="main-card">
  <div id="app-content"></div>
</div>

<script>
const spurningar = [
  { spurning: "Hvað heitir aðalpersónan úr Kollhnís?", svar: "Álfur", stadsetning: "Inni í sal", naesta: "Inni í sal" },
  { spurning: "Hvaða ár sökk Titanic?", svar: "1912", stadsetning: "Inni í sal", naesta: "Bókasafn" },
  { spurning: "Hvað eru mörg börn í árgangi 2014 í Grundaskóla?", svar: "75", stadsetning: "Bókasafn", naesta: "Bókasafn" },
  { spurning: "Hvað elskar Eiki, úr sögunni Kollhnís, að setja á matinn sinn?", svar: "Kökuskraut", stadsetning: "Bókasafn", naesta: "Matsalur" },
  { spurning: "Hvað heitir höfuðborg Grænlands?", svar: "Nuuk", stadsetning: "Matsalur", naesta: "Matsalur" },
  { spurning: "Hvaðan er rithöfundurinn Astrid Lindgren?", svar: "Svíþjóð", stadsetning: "Matsalur", naesta: "Yngra unglingastig / miðstig" },
  { spurning: "Hverjar eru náttúruauðlindir Noregs?", svar: "Olía, fiskur, vatn", stadsetning: "Yngra unglingastig / miðstig", naesta: "Yngra unglingastig / miðstig" },
  { spurning: "Reiknaðu 3/5 + 1/4 =", svar: "17/20", stadsetning: "Yngra unglingastig / miðstig", naesta: "LOV álma – tónmennt" },
  { spurning: "Hvað búa margir í Finnlandi?", svar: "5,6 milljónir", stadsetning: "LOV álman – tónmennt", naesta: "LOV álman – smíði" },
  { spurning: "Hver eru fjölmennustu trúarbrögð heims?", svar: "Kristin trú", stadsetning: "LOV álman – smíði", naesta: "Yngsta stig" },
  { spurning: "Hvað er mamman í Fólkið í blokkinni kölluð?", svar: "Sjóla", stadsetning: "Yngsta stig", naesta: "Yngsta stig" },
  { spurning: "Hvaða vitamin færð þú úr sólinni?", svar: "D-vítamín", stadsetning: "Yngsta stig", naesta: "Yngsta stig" },
  { spurning: "Til hvaða lands er Álfur að fara í æfingaferð í Kollhnís?", svar: "Til Brasilíu", stadsetning: "Yngsta stig", naesta: "Stjórnunarálma" },
  { spurning: "Hvað kallast efsti hluti svepps?", svar: "Hattur", stadsetning: "Stjórnunarálma", naesta: "Eyjan – AH" },
  { spurning: "Til hvaða lands var Titanic að sigla?", svar: "Til Bandaríkjanna", stadsetning: "Eyjan – AH", naesta: "Eyjan – gangur" },
  { spurning: "Hvað er Grundaskóli gamall?", svar: "45 ára – stofnaður 1981", stadsetning: "Eyjan – gangur", naesta: "Eyjan – VV" },
  { spurning: "Hvernig skrifar maður efnatákn vatns í efnafræði?", svar: "H₂O", stadsetning: "Eyjan – VV", naesta: "Eyjan – SS" },
  { spurning: "Hvaða fána er þetta: Eini fáninn sem er hvorki gulur, hvítur né blár?", svar: "Jamaica", stadsetning: "Eyjan – SS", naesta: "Eyjan – kaffistofa" },
  { spurning: "Hvað er 67 × 67?", svar: "4489", stadsetning: "Eyjan – kaffistofa", naesta: "Eyjan – 5. bekkur" },
  { spurning: "Hvert er hlutverk lifrarinnar?", svar: "Að hreinsa líkamann", stadsetning: "Eyjan – 5. bekkur", naesta: "Unglingagangur" },
  { spurning: "Hvað heitir páfagaukurinn hans Óla í Fólkið í blokkinni?", svar: "Jakob", stadsetning: "Unglingagangur", naesta: "Unglingagangur" },
  { spurning: "Hvað voru mörg börn á Titanic?", svar: "128 börn", stadsetning: "Unglingagangur", naesta: "Unglingagangur" },
  { spurning: "Hvað er barnasáttmáli Sameinuðu þjóðanna?", svar: "Lög um réttindi barna sem flestar þjóðir heims eru sammála um", stadsetning: "Fyrir framan LOV álmuna", naesta: "Stjórnunarálma" },
  { spurning: "Hvaða Norðurland hefur elsta fána heims (í samfeldri notkun)?", svar: "Danmörk", stadsetning: "Fyrir framan salinn", naesta: "Inn í sal" }
];

const TOTAL = spurningar.length;

function getStod() {
  const params = new URLSearchParams(window.location.search);
  const n = parseInt(params.get('stod'));
  if (!isNaN(n) && n >= 1 && n <= TOTAL) return n;
  return null;
}

function normalizeAnswer(s) {
  return s.toLowerCase()
    .replace(/[áà]/g,'a').replace(/[éè]/g,'e').replace(/[íì]/g,'i')
    .replace(/[óò]/g,'o').replace(/[úù]/g,'u').replace(/[ýÝ]/g,'y')
    .replace(/ð/g,'d').replace(/þ/g,'th').replace(/æ/g,'ae').replace(/ö/g,'o')
    .replace(/[-\s.,;:!?]/g,'').trim();
}

function render() {
  const stod = getStod();
  const content = document.getElementById('app-content');

  if (stod === null) {
    content.innerHTML = `
      <div class="card-header"><span class="header-title">🗺️ Ratleikurinn</span></div>
      <div class="error-screen">
        <h2>Skanna QR kóðann!</h2>
        <p>Þessi síða opnast sjálfkrafa þegar þú skannar QR kóðann við hverja stöð í leiknum.</p>
      </div>`;
    return;
  }

  const q = spurningar[stod - 1];
  const isLast = stod === TOTAL;
  const pct = Math.round((stod / TOTAL) * 100);

  content.innerHTML = `
    <div class="card-header">
      <span class="header-title">🗺️ Ratleikurinn</span>
      <span class="stod-badge">Stöð ${stod} / ${TOTAL}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card-body">
      <div class="location-tag">${q.stadsetning}</div>
      <div class="question-text">${q.spurning}</div>
      <div class="answer-section">
        <div class="answer-label">Svarið þitt</div>
        <input class="answer-input" type="text" id="ans-input" placeholder="Skrifaðu hér..." autocomplete="off">
      </div>
      <button class="check-btn" id="check-btn" onclick="checkAnswer()">Staðfesta svar</button>
      <div class="result-box" id="result-box">
        <div class="result-title" id="result-title"></div>
        <div class="result-answer" id="result-answer"></div>
      </div>
      <div class="next-hint" id="next-hint">
        <div class="next-hint-label">🧭 Næsta stöð</div>
        <div class="next-hint-text" id="next-hint-text"></div>
      </div>
    </div>`;

  document.getElementById('ans-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkAnswer();
  });

  window._stod = stod;
  window._q = q;
  window._isLast = isLast;
}

function checkAnswer() {
  const input = document.getElementById('ans-input');
  const val = input.value.trim();
  if (!val) return;

  const q = window._q;
  const isLast = window._isLast;
  const correct = normalizeAnswer(val) === normalizeAnswer(q.svar);

  const resultBox = document.getElementById('result-box');
  const resultTitle = document.getElementById('result-title');
  const resultAnswer = document.getElementById('result-answer');
  const nextHint = document.getElementById('next-hint');
  const nextHintText = document.getElementById('next-hint-text');
  const btn = document.getElementById('check-btn');

  input.classList.remove('correct','wrong');

  if (correct) {
    input.classList.add('correct');
    resultBox.className = 'result-box correct-box';
    resultTitle.textContent = '✅ Rétt! Vel gert!';
    resultAnswer.textContent = '';
    resultBox.style.display = 'block';
    btn.disabled = true;

    if (isLast) {
      nextHint.style.display = 'block';
      nextHintText.textContent = '🎉 Þið hafið lokið ratleiknum! Til hamingju!';
    } else {
      nextHint.style.display = 'block';
      nextHintText.textContent = q.naesta;
    }
  } else {
    input.classList.add('wrong');
    resultBox.className = 'result-box wrong-box';
    resultTitle.textContent = '❌ Ekki alveg rétt — reyndu aftur!';
    resultAnswer.textContent = '';
    resultBox.style.display = 'block';
    setTimeout(() => {
      input.classList.remove('wrong');
      resultBox.style.display = 'none';
      input.focus();
    }, 1800);
  }
}

render();
</script>
</body>
</html>
